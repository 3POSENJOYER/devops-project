name: CI/CD Pipeline to Docker Hub

on:
  push:
    branches: [ "main", "master" ] 
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Node.js app
      uses: docker/build-push-action@v6
      with:
        context: ./bezkoder-app
        file: ./bezkoder-app/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/bezkoder-node-app:latest
          ${{ secrets.DOCKER_USERNAME }}/bezkoder-node-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

